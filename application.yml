apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spring-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/imedjadli-dev/devops-backend-config
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: devops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
